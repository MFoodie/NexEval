spring:
  application:
    name: nexeval-api

  mail:
    host: ${SMTP_HOST:smtp.qq.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:382178825@qq.com}
    password: ${SMTP_PASSWORD:wklooaxidtezbhja}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/sedb?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: ${SSL_KEY_STORE:file:./certs/nexeval.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:nexeval}
  http2:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

nexeval:
  security:
    allowed-origins: ${ALLOWED_ORIGINS:https://localhost:5173}
  avatar:
    dir: ${AVATAR_DIR:./avatar}
  password-reset:
    token-ttl-minutes: 15
    rate-limit-seconds: 60
    reset-page-url: ${RESET_PAGE_URL:https://localhost:5173/reset-password}

dashscope:
  api-key: "sk-f5396c4057cb49a4a3ffb16117d0e37e"
  model: ${DASHSCOPE_MODEL:qwen3-vl-flash}
  confidence-threshold: ${DASHSCOPE_CONFIDENCE_THRESHOLD:0.8}
