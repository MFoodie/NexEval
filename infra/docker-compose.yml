services:
  mysql:
    image: mysql:8.4
    container_name: nexeval-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in infra/.env}
      MYSQL_DATABASE: sedb
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
      - ../docs/database:/docker-entrypoint-initdb.d:ro
      - ./mysql.cnf:/etc/mysql/conf.d/charset.cnf:ro

  redis:
    image: redis:7.2
    container_name: nexeval-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    container_name: nexeval-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in infra/.env}
      SERVER_PORT: 8080
      SSL_ENABLED: "false"
      ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RESET_PAGE_URL: http://localhost/reset-password
      SMTP_HOST: smtp.qq.com
      SMTP_PORT: 587
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - ../server/avatar:/app/avatar
      - ../server/fig:/app/fig
      - ../server/question-images:/app/question-images
      - ../server/answer-images:/app/answer-images

  frontend:
    build:
      context: ..
      dockerfile: infra/client.Dockerfile
    container_name: nexeval-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
