services:
  mysql:
    image: mysql:8.4
    container_name: nexeval-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sedb
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
      - ../docs/database:/docker-entrypoint-initdb.d:ro
      - ./mysql.cnf:/etc/mysql/conf.d/charset.cnf:ro

  redis:
    image: redis:7.2
    container_name: nexeval-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    container_name: nexeval-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      SERVER_PORT: 8080
      SSL_ENABLED: "false"
      ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
    ports:
      - "8080:8080"
    volumes:
      - ../server/avatar:/app/avatar
      - ../server/fig:/app/fig
      - ../server/question-images:/app/question-images
      - ../server/answer-images:/app/answer-images

  frontend:
    build:
      context: ..
      dockerfile: infra/client.Dockerfile
    container_name: nexeval-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
